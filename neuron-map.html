<script id="viz-script">
// ── LINKS: connect nodes sharing ≥1 tag ──────────────────────────────────
const LINKS = [];
for(let i=0;i<NODES.length;i++){
  for(let j=i+1;j<NODES.length;j++){
    const shared = NODES[i].tags.filter(t=>NODES[j].tags.includes(t));
    if(shared.length>0) LINKS.push({source:NODES[i].id,target:NODES[j].id,strength:shared.length});
  }
}

// ── STATE ─────────────────────────────────────────────────────────────────
let activeFolder = null;
let searchQuery = '';
let selectedNode = null;

// ── FILTER CHIPS ──────────────────────────────────────────────────────────
const filtersEl = document.getElementById('filters');
const folders = Object.keys(FOLDER_COLORS);
const allChip = document.createElement('div');
allChip.className='chip active';allChip.textContent='전체';
allChip.style.color='#e0e0e0';allChip.style.borderColor='#e0e0e0';
allChip.onclick=()=>{activeFolder=null;updateChips();applyFilter()};
filtersEl.appendChild(allChip);

folders.forEach(f=>{
  const c=document.createElement('div');
  c.className='chip';c.textContent=f;c.style.color=FOLDER_COLORS[f];
  c.onclick=()=>{activeFolder=(activeFolder===f?null:f);updateChips();applyFilter()};
  filtersEl.appendChild(c);
});

function updateChips(){
  const chips=[...filtersEl.querySelectorAll('.chip')];
  chips[0].classList.toggle('active',!activeFolder);
  folders.forEach((f,i)=>{
    chips[i+1].classList.toggle('active',activeFolder===f);
    if(activeFolder===f) chips[i+1].style.borderColor=FOLDER_COLORS[f];
    else chips[i+1].style.borderColor='transparent';
  });
}

// ── SEARCH ────────────────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input',e=>{
  searchQuery=e.target.value.toLowerCase();applyFilter();
});

function applyFilter(){
  const nodeEls=svg.selectAll('.node');
  nodeEls.each(function(d){
    const matchFolder=!activeFolder||d.folder===activeFolder;
    const matchSearch=!searchQuery||d.title.toLowerCase().includes(searchQuery)||d.tags.join(' ').toLowerCase().includes(searchQuery);
    d3.select(this).classed('dimmed',!(matchFolder&&matchSearch));
    d3.select(this).classed('highlighted',false);
  });
  updateCount();
}

function updateCount(){
  const visible=NODES.filter(d=>{
    const mf=!activeFolder||d.folder===activeFolder;
    const ms=!searchQuery||d.title.toLowerCase().includes(searchQuery)||d.tags.join(' ').toLowerCase().includes(searchQuery);
    return mf&&ms;
  }).length;
  document.getElementById('node-count').textContent=`${visible} / ${NODES.length} 노트`;
}

// ── SVG SETUP ─────────────────────────────────────────────────────────────
const svgEl=document.getElementById('graph');
const svg=d3.select(svgEl);
const W=()=>svgEl.clientWidth, H=()=>svgEl.clientHeight;

// defs: glow filter
const defs=svg.append('defs');
const filter=defs.append('filter').attr('id','glow').attr('x','-50%').attr('y','-50%').attr('width','200%').attr('height','200%');
filter.append('feGaussianBlur').attr('stdDeviation','3').attr('result','blur');
const merge=filter.append('feMerge');
merge.append('feMergeNode').attr('in','blur');
merge.append('feMergeNode').attr('in','SourceGraphic');

const g=svg.append('g');

// ── ZOOM ──────────────────────────────────────────────────────────────────
const zoom=d3.zoom().scaleExtent([0.2,4]).on('zoom',e=>g.attr('transform',e.transform));
svg.call(zoom);
svg.on('click',e=>{if(e.target===svgEl||e.target.tagName==='g')closeSidebar()});

// ── SIMULATION ────────────────────────────────────────────────────────────
const sim=d3.forceSimulation(NODES)
  .force('link',d3.forceLink(LINKS).id(d=>d.id).distance(d=>100-d.strength*15).strength(0.4))
  .force('charge',d3.forceManyBody().strength(-180))
  .force('center',d3.forceCenter(0,0))
  .force('collision',d3.forceCollide(22));

// ── LINKS ─────────────────────────────────────────────────────────────────
const linkSel=g.append('g').selectAll('line').data(LINKS).join('line')
  .attr('class','link')
  .attr('stroke-width',d=>d.strength>1?1.5:0.8);

// ── NODES ─────────────────────────────────────────────────────────────────
const nodeSel=g.append('g').selectAll('.node').data(NODES).join('g')
  .attr('class','node')
  .call(d3.drag()
    .on('start',(e,d)=>{if(!e.active)sim.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y})
    .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y})
    .on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}))
  .on('click',(e,d)=>{e.stopPropagation();openSidebar(d);
    svg.selectAll('.node').classed('highlighted',n=>n.id===d.id);
  });

nodeSel.append('circle')
  .attr('r',d=>10+d.tags.length*2)
  .attr('fill',d=>d.color+'33')
  .attr('stroke',d=>d.color)
  .attr('filter','url(#glow)');

nodeSel.append('text')
  .attr('dy',d=>14+d.tags.length*2)
  .text(d=>d.title.length>18?d.title.slice(0,17)+'…':d.title);

// ── TICK ──────────────────────────────────────────────────────────────────
sim.on('tick',()=>{
  linkSel
    .attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
    .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
  nodeSel.attr('transform',d=>`translate(${d.x},${d.y})`);
});

// center on first render
sim.on('end',()=>{
  const t=d3.zoomIdentity.translate(W()/2,H()/2).scale(0.9);
  svg.transition().duration(600).call(zoom.transform,t);
});
svg.call(zoom.transform,d3.zoomIdentity.translate(W()/2,H()/2));

// ── SIDEBAR ───────────────────────────────────────────────────────────────
function openSidebar(d){
  selectedNode=d;
  document.getElementById('sb-title').textContent=d.title;
  document.getElementById('sb-meta').textContent=`${d.folder} · ${d.date}`;
  const tagsEl=document.getElementById('sb-tags');
  tagsEl.innerHTML=d.tags.map(t=>`<span class="tag-pill">${t}</span>`).join('');
  document.getElementById('sb-desc').textContent=d.desc;
  const src=document.getElementById('sb-source');
  if(d.source){src.href=d.source;src.textContent='→ 원본 링크';}
  else{src.textContent='';}
  document.getElementById('sidebar').classList.add('open');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  svg.selectAll('.node').classed('highlighted',false);
}
document.getElementById('close-btn').onclick=closeSidebar;

// ── LEGEND ────────────────────────────────────────────────────────────────
const legendEl=document.getElementById('legend');
folders.forEach(f=>{
  const count=NODES.filter(n=>n.folder===f).length;
  const item=document.createElement('div');item.className='legend-item';
  item.innerHTML=`<div class="legend-dot" style="background:${FOLDER_COLORS[f]};box-shadow:0 0 6px ${FOLDER_COLORS[f]}"></div><span>${f} (${count})</span>`;
  legendEl.appendChild(item);
});

updateCount();
</script>
</body>
</html>
